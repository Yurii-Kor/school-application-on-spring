spring:
  application:
    name: SchoolApplicationSpring

  datasource:
    url: jdbc:postgresql://localhost:5433/school_console_app
    username: postgres
    password: 19
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 30000
      auto-commit: true

  flyway:
    locations: classpath:db/migration
    sql-migration-prefix: V
    clean-disabled: false
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
